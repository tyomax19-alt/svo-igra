<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0f3b40">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Игра про вас">
<meta property="og:title" content="Демо-раунд — Игра про вас">
<meta property="og:description" content="Сыграйте демо-раунд прямо сейчас, без регистрации.">
<meta property="og:url" content="https://igra-pro-vas.ru/demo">
<meta property="og:image" content="https://igra-pro-vas.ru/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Сыграйте демо-раунд прямо сейчас, без регистрации.">
<title>Демо — Свои люди</title>
<link rel="stylesheet" href="site.css">
<style>
.scores{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
.score{ background:var(--s1); padding:6px 14px; font-weight:600; }
.score.turn{ background:#1b5157; }
.score b{ display:block; font-family:var(--pixel); font-weight:700; font-size:44px; line-height:1; margin-top:2px; }
.board{ display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; }
.cat{ font-size:15px; font-weight:600; text-align:center; padding:6px 2px; line-height:1.1; overflow-wrap:anywhere; }
.cell{ background:#f3e7cf; color:#0f3b40; border:none; border-radius:0; padding:10px 0; font-family:var(--pixel); font-weight:700; font-size:52px; line-height:1; cursor:pointer; box-shadow:0 5px 0 #08222a; transition:transform .2s var(--spring), background .15s; }
.cell:hover:not(:disabled){ background:#ff6b3d; transform:translateY(-4px) rotate(-1deg); }
.cell:disabled{ background:#0b2f33; color:transparent; box-shadow:none; cursor:default; }
.q{ font-size:30px; font-weight:600; line-height:1.2; margin:14px 0; }
.a{ font-size:26px; font-weight:700; color:#ff6b3d; margin-bottom:14px; }
.actions{ display:flex; gap:10px; flex-wrap:wrap; }
@media (max-width:560px){ .board{ gap:5px; } .cell{ padding:7px 0; font-size:26px; } .cat{ font-size:11px; overflow-wrap:normal; hyphens:auto; } }
</style>
</head>
<body>
<main class="wrap">
  <h1>Демо-раунд</h1>
  <p class="lead">Один раунд на одном устройстве, без регистрации. В настоящей игре каждый играет со своего телефона, а вопросы про вашу компанию.</p>

  <section class="card" id="setup">
    <h2>Кто играет</h2>
    <label class="f">Имена через запятую, от 2 до 10
      <input id="names" value="Игрок 1, Игрок 2" maxlength="200">
    </label>
    <div class="err" id="err" role="alert"></div>
    <button class="btn block" id="start" type="button">Начать</button>
  </section>

  <section id="game" hidden>
    <div class="scores" id="scores"></div>
    <div class="card" id="question" hidden aria-live="polite"></div>
    <div class="board" id="board"></div>
  </section>

  <section class="card" id="finish" hidden>
    <h2>Раунд окончен</h2>
    <p id="result" style="margin-bottom:14px"></p>
    <a class="btn block" href="order">Заказать игру под свою вечеринку</a>
  </section>
  <div class="foot"><a href="./">На главную</a></div>
</main>

<script type="module">
const $ = id => document.getElementById(id);
let pack=null, players=[], turn=0, left=0;

function renderScores(){
  const box=$('scores'); box.replaceChildren();
  players.forEach((p,i)=>{
    const el=document.createElement('div'); el.className='score'+(i===turn?' turn':'');
    const v=document.createElement('b'); v.textContent=p.score;
    el.append(p.name,v); box.append(el);
  });
}
function renderBoard(){
  const board=$('board'); board.replaceChildren();
  for(const c of pack.categories){
    const el=document.createElement('div'); el.className='cat'; el.textContent=c.name; board.append(el);
  }
  for(let qi=0;qi<5;qi++){
    pack.categories.forEach(c=>{
      const q=c.questions[qi];
      const b=document.createElement('button'); b.type='button'; b.className='cell'; b.textContent=q.value;
      b.setAttribute('aria-label',`${c.name}, ${q.value}`);
      b.addEventListener('click',()=>{ b.disabled=true; openQuestion(c,q); });
      board.append(b);
    });
  }
}
function setBoardLocked(locked){
  $('board').hidden=locked;
}
function openQuestion(c,q){
  setBoardLocked(true);
  const box=$('question'); box.hidden=false; box.replaceChildren();
  const h=document.createElement('h2'); h.textContent=`${c.name}, ${q.value}. Отвечает: ${players[turn].name}`;
  const t=document.createElement('p'); t.className='q'; t.textContent=q.question;
  const actions=document.createElement('div'); actions.className='actions';
  const show=document.createElement('button'); show.type='button'; show.className='btn'; show.textContent='Показать ответ';
  show.addEventListener('click',()=>{
    const a=document.createElement('p'); a.className='a'; a.textContent=q.answer;
    t.after(a); actions.replaceChildren();
    const mk=(label,cls,delta)=>{
      const b=document.createElement('button'); b.type='button'; b.className='btn '+cls; b.textContent=label;
      b.addEventListener('click',()=>closeQuestion(delta)); actions.append(b);
    };
    mk(`Правильно +${q.value}`,'good',q.value);
    mk(`Неправильно -${q.value}`,'bad',-q.value);
  });
  actions.append(show); box.append(h,t,actions);
}
function closeQuestion(delta){
  players[turn].score+=delta;
  turn=(turn+1)%players.length;
  left--;
  $('question').hidden=true;
  setBoardLocked(false);
  renderScores();
  if(left===0) finish();
}
function finish(){
  $('game').hidden=true; $('finish').hidden=false;
  const top=[...players].sort((a,b)=>b.score-a.score)[0];
  $('result').textContent=`Победитель: ${top.name}, ${top.score} очков.`;
}
$('start').addEventListener('click',async()=>{
  const names=$('names').value.split(',').map(s=>s.trim()).filter(Boolean);
  if(names.length<2||names.length>10){ $('err').textContent='Укажите от 2 до 10 имён.'; return; }
  try{
    const res=await fetch('demo-pack.json'); if(!res.ok) throw new Error();
    pack=await res.json();
  }catch(e){ $('err').textContent='Не удалось загрузить вопросы. Обновите страницу.'; return; }
  players=names.map(name=>({name,score:0}));
  turn=0; left=pack.categories.length*5;
  $('setup').hidden=true; $('game').hidden=false;
  renderScores(); renderBoard();
});
</script>
</body>
</html>
