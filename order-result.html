<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заказ — Свои люди</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<main class="wrap">
  <h1 id="title">Спасибо за заказ</h1>
  <p class="lead" id="text">Когда платёж подтвердится, мы подготовим вопросы, проверим их и пришлём ссылку на игру в сообщении на Авито.</p>
  <div class="foot"><a href="./">На главную</a></div>
</main>
<script>
if(new URLSearchParams(location.search).get('status')==='fail'){
  document.getElementById('title').textContent='Оплата не прошла';
  document.getElementById('text').textContent='Деньги не списаны. Напишите нам на Авито, и мы поможем оформить заказ.';
}
</script>
</body>
</html>
