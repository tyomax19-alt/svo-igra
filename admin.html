<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Панель оператора — Свои люди</title>
<style>
/* Панель оператора: обычный рабочий интерфейс, без игрового стиля */
:root{ --bg:#f5f6f8; --card:#fff; --line:#e3e6eb; --text:#16191d; --dim:#666e78; --accent:#1f6feb; --red:#d1242f; --green:#1a7f37;
  --s2:#f0f2f5; --dim2:#666e78; }
*{ box-sizing:border-box; margin:0; padding:0; }
[hidden]{ display:none !important; }
body{ background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
.wrap{ max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
h1{ font-size:24px; font-weight:650; margin-bottom:16px; }
h2{ font-size:17px; font-weight:650; margin-bottom:12px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:16px; }
label.f{ display:block; font-size:13px; font-weight:600; color:var(--dim); margin-bottom:12px; }
input,select,textarea{ display:block; width:100%; margin-top:4px; background:#fff; border:1px solid #cfd4db; border-radius:6px; padding:8px 10px; color:var(--text); font:inherit; }
input:focus,select:focus,textarea:focus{ outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent; }
textarea{ font-family:ui-monospace,Consolas,monospace; font-size:13px; }
.row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:0 12px; }
.btn{ display:inline-block; padding:8px 14px; border:1px solid var(--accent); border-radius:6px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
.btn:hover:not(:disabled){ filter:brightness(1.08); }
.btn.ghost{ background:#fff; color:var(--text); border-color:#cfd4db; }
.btn.ghost:hover:not(:disabled){ background:var(--s2); filter:none; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.err{ color:var(--red); margin:8px 0; white-space:pre-line; }
.err:empty,.ok:empty{ display:none; }
.ok{ color:var(--green); margin:8px 0; }
.muted{ color:var(--dim); }
details{ margin-bottom:10px; }
details summary{ cursor:pointer; font-weight:600; padding:4px 0; }
.orders{ display:flex; flex-direction:column; gap:6px; }
.order-btn{ display:flex; justify-content:space-between; gap:12px; width:100%; text-align:left; background:#fff; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:9px 12px; font:inherit; cursor:pointer; }
.order-btn:hover{ background:var(--s2); }
.order-btn.sel{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.status{ color:var(--dim); white-space:nowrap; font-size:13px; }
.alert{ color:var(--red); font-weight:600; }
.facts{ display:grid; grid-template-columns:max-content 1fr; gap:4px 14px; margin-bottom:14px; }
.facts dt{ color:var(--dim); }
.facts dd{ overflow-wrap:anywhere; }
.actions{ display:flex; flex-wrap:wrap; gap:10px; margin:12px 0; }
.q-row{ display:grid; grid-template-columns:60px 2fr 1.4fr 130px 1.4fr; gap:6px; margin-bottom:6px; align-items:center; }
.q-row input,.q-row select{ margin-top:0; padding:6px 8px; font-size:17px; }
.cat-name{ margin:14px 0 8px; }
.photos{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.photos figure{ background:var(--s2); padding:8px; font-size:15px; }
.photos img{ width:100%; height:110px; object-fit:cover; }
@media (max-width:760px){ .q-row{ grid-template-columns:1fr; margin-bottom:14px; } }
</style>
</head>
<body>
<main class="wrap wide">
  <h1>Панель оператора</h1>

  <form class="card" id="loginCard" hidden>
    <h2>Вход</h2>
    <label class="f">Email <input id="email" type="email" autocomplete="username"></label>
    <label class="f">Пароль <input id="password" type="password" autocomplete="current-password"></label>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn" type="submit">Войти</button>
  </form>

  <div id="panel" hidden>
    <div class="actions"><button class="btn ghost" id="logout" type="button">Выйти</button></div>
    <form class="card" id="newPack">
      <h2>Новый пак</h2>
      <div class="row">
        <label class="f">Ник покупателя <input id="npContact" maxlength="80" autocomplete="off"></label>
        <label class="f">Повод <input id="npTheme" maxlength="200" placeholder="30 лет Ане" autocomplete="off"></label>
        <label class="f">Цена, ₽ <input id="npPrice" type="number" min="0" value="1990"></label>
      </div>
      <label class="f">Вопросы в формате JSON
        <textarea id="npJson" rows="6" spellcheck="false"></textarea>
      </label>
      <div class="err" id="npErr" role="alert"></div>
      <div class="ok" id="npOk" role="status"></div>
      <div class="actions">
        <button class="btn" type="submit">Создать и открыть в редакторе</button>
        <button class="btn ghost" id="copyPrompt" type="button">Скопировать промпт для нейросети</button>
      </div>
    </form>
    <section class="card">
      <h2>Анкеты</h2>
      <p class="muted" style="margin-bottom:10px">Ссылка для покупателей: <a id="anketaLink" style="color:inherit"></a></p>
      <div class="err" id="formsErr" role="alert"></div>
      <div class="orders" id="forms"></div>
    </section>
    <section class="card" id="formDetail" hidden></section>
    <section class="card">
      <h2>Заказы</h2>
      <div class="err" id="listErr" role="alert"></div>
      <div class="orders" id="orders"></div>
    </section>
    <section class="card" id="detail" hidden></section>
    <section class="card" id="editorCard" hidden>
      <h2>Черновик пака</h2>
      <label class="f">Название <input id="packTitle"></label>
      <div id="editor"></div>
      <div class="err" id="editErr" role="alert"></div>
      <div class="ok" id="editOk" role="status"></div>
      <div class="actions">
        <button class="btn ghost" id="check" type="button">Проверить</button>
        <button class="btn ghost" id="save" type="button">Сохранить черновик</button>
        <button class="btn" id="publish" type="button">Опубликовать</button>
      </div>
    </section>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { OCCASIONS, BUYER, BUYER_END, GUEST, setOf } from "./anketa-schema.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { validateBoard, normalizeBoard, VALID_MODIFIERS } from "./pack-validator.js";
import { AGE_GROUPS, DIFFICULTIES, LANGUAGES } from "./order-schema.js";
import { CHAT_PROMPT } from "./pack-prompt.js";

const app = initializeApp({
  apiKey: "AIzaSyD2BJ0Stblry4i3wD_ml0d7WqVsPDwW8RM",
  authDomain: "svoua-igra.firebaseapp.com",
  databaseURL: "https://svoua-igra-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "svoua-igra"
});
const db = getDatabase(app);
const auth = getAuth(app);

const STATUS = {
  new:'Новый', awaiting_payment:'Ждёт оплаты', payment_failed:'Оплата не прошла', paid:'Оплачен',
  generating:'Генерация', draft_ready:'Черновик готов', generation_failed:'Ошибка генерации', published:'Опубликован'
};
const GENERATABLE = ['paid','draft_ready','generation_failed'];
const PUBLISHABLE = ['draft_ready','published'];
const MOD_LABELS = { double:'Удвоение', flip_sign:'Смена знака', give_points:'Отдать очки', take_points:'Забрать очки', all_in:'Ва-банк' };

const $ = id => document.getElementById(id);
let orders = {};
let selectedId = null;
let draft = null;        // редактируемая копия черновика
let dirty = false;
let stopOrders = null;

function el(tag, props = {}, ...children){
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children.filter(c => c !== null && c !== undefined));
  return node;
}
function randomPackId(){
  const chars='abcdefghijkmnopqrstuvwxyz23456789';
  return [...crypto.getRandomValues(new Uint8Array(20))].map(b=>chars[b%chars.length]).join('');
}

function renderOrders(){
  const list=$('orders'); list.replaceChildren();
  const ids=Object.keys(orders).sort((a,b)=>(orders[b].createdAt||0)-(orders[a].createdAt||0));
  if(!ids.length){ list.append(el('p',{className:'muted',textContent:'Заказов пока нет.'})); return; }
  for(const id of ids){
    const o=orders[id];
    const btn=el('button',{type:'button',className:'order-btn'+(id===selectedId?' sel':'')},
      el('span',{textContent:`${new Date(o.createdAt||0).toLocaleDateString('ru-RU')} · ${o.contact||''} · ${(o.theme||'').slice(0,60)}`}),
      el('span',{className:'status',textContent:(o.paymentAlert?`${o.paymentAlert} · `:'')+(STATUS[o.status]||o.status||'')}));
    btn.addEventListener('click',()=>selectOrder(id));
    list.append(btn);
  }
}
function selectOrder(id){
  if(dirty && id!==selectedId && !confirm('Несохранённые правки будут потеряны. Перейти к другому заказу?')) return;
  selectedId=id; draft=null; dirty=false;
  renderOrders(); renderDetail(); syncEditor();
}
function fact(list,label,value){ list.append(el('dt',{textContent:label}),el('dd',{textContent:value})); }
function renderDetail(){
  const box=$('detail'); const o=orders[selectedId];
  if(!o){ box.hidden=true; return; }
  box.hidden=false; box.replaceChildren(el('h2',{textContent:`Заказ ${selectedId}`}));
  const facts=el('dl',{className:'facts'});
  fact(facts,'Статус',STATUS[o.status]||o.status);
  fact(facts,'Ник на Авито',o.contact);
  fact(facts,'Тема',o.theme); fact(facts,'Цена',`${o.priceRub} ₽`);
  if(!o.manual){
    fact(facts,'Email',o.email); fact(facts,'Игроков',o.players);
    fact(facts,'Возраст',AGE_GROUPS[o.ageGroup]||o.ageGroup); fact(facts,'Сложность',DIFFICULTIES[o.difficulty]||o.difficulty);
    fact(facts,'Язык',LANGUAGES[o.language]||o.language); fact(facts,'Дата вечеринки',o.partyDate);
    fact(facts,'18+',o.adult18?'Да':'Нет');
  }
  box.append(facts);
  if(o.paymentAlert) box.append(el('p',{className:'alert',textContent:`Внимание, статус платежа: ${o.paymentAlert}. Проверьте кабинет Platega.`}));
  if(o.generationErrors) box.append(el('div',{className:'err',textContent:[].concat(o.generationErrors).join('\n')}));
  if(o.packId){
    const link=new URL(`./?pack=${o.packId}`,location.href).href;
    const copy=el('button',{type:'button',className:'btn ghost',textContent:'Копировать ссылку'});
    copy.addEventListener('click',()=>navigator.clipboard.writeText(link));
    box.append(el('p',{className:'ok'},'Ссылка для покупателя: ',el('a',{href:link,textContent:link,style:'color:inherit'})),copy);
  }
  if(!o.manual){
    const actions=el('div',{className:'actions'});
    const gen=el('button',{type:'button',className:'btn',textContent:o.draft?'Сгенерировать заново':'Сгенерировать черновик'});
    gen.disabled=!GENERATABLE.includes(o.status);
    gen.addEventListener('click',()=>startGeneration(gen));
    actions.append(gen); box.append(actions);
  }
  if(!o.manual && !GENERATABLE.includes(o.status) && o.status!=='generating' && o.status!=='published'){
    box.append(el('p',{className:'muted',textContent:'Генерация и публикация доступны после оплаты.'}));
  }
  const photos=Object.values(o.photos||{});
  if(photos.length){
    box.append(el('h2',{textContent:'Фото'}),el('p',{className:'muted',textContent:'Скопируйте адрес фото в поле «Картинка» нужного вопроса.'}));
    const grid=el('div',{className:'photos'});
    for(const p of photos){
      const url=`/.netlify/functions/photo?key=${encodeURIComponent(p.key)}`;
      const copy=el('button',{type:'button',className:'btn ghost',textContent:'Копировать адрес'});
      copy.addEventListener('click',()=>navigator.clipboard.writeText(url));
      grid.append(el('figure',{},el('img',{src:url,alt:p.caption||'Фото заказа'}),el('figcaption',{textContent:p.caption||''}),copy));
    }
    box.append(grid);
  }
}
async function startGeneration(btn){
  if(orders[selectedId].draft && !confirm('Черновик будет заменён новым, запрос платный. Продолжить?')) return;
  btn.disabled=true;
  try{
    const token=await auth.currentUser.getIdToken();
    const res=await fetch('/.netlify/functions/generate-pack-background',{
      method:'POST', headers:{'content-type':'application/json',authorization:`Bearer ${token}`},
      body:JSON.stringify({orderId:selectedId})
    });
    if(res.status!==202) throw new Error(`HTTP ${res.status}`);
    dirty=false; draft=null;
  }catch(e){ alert('Не удалось запустить генерацию: '+e.message); btn.disabled=false; }
}

function syncEditor(){
  const o=orders[selectedId];
  if(!o || !o.draft){ $('editorCard').hidden=true; return; }
  if(dirty) return;   // не затираем правки оператора обновлением из базы
  draft=structuredClone(o.draft);
  renderEditor();
  $('editorCard').hidden=false;
}
function bind(input,obj,key){
  input.value=obj[key]??'';
  input.oninput=()=>{ obj[key]=input.value; dirty=true; };
  return input;
}
function imageInput(q){
  const input=el('input',{placeholder:'Картинка: адрес',ariaLabel:'Адрес картинки'});
  input.value=[].concat(q.image||[]).join(' ');
  input.addEventListener('input',()=>{
    const v=input.value.trim();
    if(v) q.image=v.split(/\s+/); else delete q.image;
    dirty=true;
  });
  return input;
}
function modifierSelect(q){
  const sel=el('select',{ariaLabel:'Модификатор'},el('option',{value:'',textContent:'Без модификатора'}),
    ...VALID_MODIFIERS.map(m=>el('option',{value:m,textContent:MOD_LABELS[m]||m})));
  sel.value=q.modifier||'';
  sel.addEventListener('change',()=>{ q.modifier=sel.value||null; dirty=true; });
  return sel;
}
function renderEditor(){
  bind($('packTitle'),draft,'title');
  const box=$('editor'); box.replaceChildren();
  draft.rounds.forEach((r,ri)=>{
    const d=el('details',{open:ri===0},el('summary',{textContent:r.name||`Раунд ${ri+1}`}));
    for(const c of r.categories){
      d.append(el('div',{className:'cat-name'},bind(el('input',{ariaLabel:'Название категории'}),c,'name')));
      for(const q of c.questions){
        d.append(el('div',{className:'q-row'},
          el('span',{textContent:q.value}),
          bind(el('input',{placeholder:'Вопрос',ariaLabel:'Вопрос'}),q,'question'),
          bind(el('input',{placeholder:'Ответ',ariaLabel:'Ответ'}),q,'answer'),
          modifierSelect(q), imageInput(q)));
      }
    }
    box.append(d);
  });
}
function validateDraft(){
  const errors=validateBoard(draft);
  $('editErr').textContent=errors.slice(0,30).join('\n');
  $('editOk').textContent=errors.length?'':'Пак прошёл проверку.';
  return errors.length===0;
}
async function saveDraft(){
  await update(ref(db,`orders/${selectedId}`),{draft});
  dirty=false; $('editOk').textContent='Черновик сохранён.';
}
async function publish(){
  const o=orders[selectedId];
  if(!PUBLISHABLE.includes(o.status) || !o.paidAt){ $('editErr').textContent='Публикация доступна только для оплаченного заказа с готовым черновиком.'; return; }
  if(!validateDraft()) return;
  if(!confirm('Опубликовать пак? Он станет доступен всем, у кого есть ссылка.')) return;
  const packId=o.packId||randomPackId();
  const board=normalizeBoard(draft);
  await set(ref(db,`packs/${packId}`),{board,publishedAt:Date.now()});
  await update(ref(db,`orders/${selectedId}`),{status:'published',packId,draft});
  dirty=false; $('editOk').textContent='Пак опубликован.';
}
const guarded = fn => async () => { try{ await fn(); }catch(e){ $('editErr').textContent='Ошибка: '+e.message; } };

// Ручной заказ: оплату оператор получил сам, поэтому заказ сразу считается оплаченным.
function loadBase(){
  return JSON.parse($('npJson').value.replace(/^\s*```(?:json)?|```\s*$/g,''));
}
async function createManualPack(e){
  e.preventDefault();
  $('npErr').textContent=''; $('npOk').textContent='';
  const contact=$('npContact').value.trim(), theme=$('npTheme').value.trim();
  if(!contact||!theme){ $('npErr').textContent='Укажите ник покупателя и повод.'; return; }
  let board;
  try{ board=loadBase(); }
  catch(err){ $('npErr').textContent='Не удалось прочитать вопросы: '+err.message; return; }
  const errors=validateBoard(board);
  if(errors.length){ $('npErr').textContent=errors.slice(0,15).join('\n'); return; }
  const id=randomPackId().slice(0,12);
  const now=Date.now();
  try{
    await set(ref(db,`orders/${id}`),{
      manual:true, contact, theme, priceRub:Number($('npPrice').value)||0,
      status:'draft_ready', createdAt:now, paidAt:now, draft:normalizeBoard(board)
    });
  }catch(err){ $('npErr').textContent='Не удалось сохранить: '+err.message; return; }
  $('newPack').reset();
  orders[id]=orders[id]||{ manual:true, contact, theme, status:'draft_ready', createdAt:now, paidAt:now, draft:normalizeBoard(board) };
  selectOrder(id);
  $('editorCard').scrollIntoView({behavior:'smooth'});
}
$('newPack').addEventListener('submit',createManualPack);
$('copyPrompt').addEventListener('click',async()=>{
  await navigator.clipboard.writeText(CHAT_PROMPT);
  $('npOk').textContent='Промпт скопирован. Допишите бриф и вставьте в чат с нейросетью.';
});

/* ── анкеты ── */
let forms = {};
let selectedForm = null;
let stopForms = null;
const anketaUrl = new URL('anketa.html', location.href).href;
$('anketaLink').textContent = anketaUrl; $('anketaLink').href = anketaUrl;

function formTitle(f){
  const m = f.meta || {};
  return `${(OCCASIONS[m.occasion]||{}).label||'Анкета'}: ${m.hero||''}`;
}
function renderForms(){
  const list=$('forms'); list.replaceChildren();
  const ids=Object.keys(forms).sort((a,b)=>((forms[b].meta||{}).createdAt||0)-((forms[a].meta||{}).createdAt||0));
  if(!ids.length){ list.append(el('p',{className:'muted',textContent:'Анкет пока нет.'})); return; }
  for(const id of ids){
    const f=forms[id], m=f.meta||{};
    const filled=Object.keys(f.buyer||{}).filter(k=>k!=='updatedAt'&&f.buyer[k]).length;
    const guests=Object.keys(f.guests||{}).length;
    const btn=el('button',{type:'button',className:'order-btn'+(id===selectedForm?' sel':'')},
      el('span',{textContent:`${new Date(m.createdAt||0).toLocaleDateString('ru-RU')} · ${m.avito||'без имени'} · ${formTitle(f)}`}),
      el('span',{className:'status',textContent:`${id} · ответов ${filled} · гостей ${guests}`}));
    btn.addEventListener('click',()=>{ selectedForm=id; renderForms(); renderFormDetail(); });
    list.append(btn);
  }
}
// весь текст анкеты одним куском: удобно отдать тому, кто собирает пак
function formText(id){
  const f=forms[id], m=f.meta||{}, s=setOf(m.occasion), b=f.buyer||{};
  const lines=[`Анкета ${id}`,`Повод: ${(OCCASIONS[m.occasion]||{}).label||m.occasion}`,`Герой: ${m.hero}`,`Игроков: ${m.players>10?'больше 10':m.players}`,`Ник на Авито: ${m.avito||'-'}`,''];
  for(const [k,label] of [...(BUYER[s]||[]),...BUYER_END,['topics','Общие темы'],['othertopics','Другие темы']]) if(b[k]) lines.push(`${label}:\n${b[k]}`,'');
  const gs=Object.values(f.guests||{});
  gs.forEach((g,i)=>{
    lines.push(`Гость ${i+1}${g.name?` (${g.name})`:''}:`);
    for(const [k,label] of GUEST[s]||[]) if(g[k]) lines.push(`${label}: ${g[k]}`);
    lines.push('');
  });
  return lines.join('\n').trim();
}
function renderFormDetail(){
  const box=$('formDetail'); const f=forms[selectedForm];
  if(!f){ box.hidden=true; return; }
  box.hidden=false;
  const text=formText(selectedForm);
  const pre=el('pre',{textContent:text,style:'white-space:pre-wrap;font:inherit;background:var(--s2);border-radius:6px;padding:14px;margin:10px 0;max-height:560px;overflow:auto'});
  const copy=el('button',{type:'button',className:'btn',textContent:'Копировать всё'});
  copy.addEventListener('click',async()=>{ await navigator.clipboard.writeText(text); copy.textContent='Скопировано'; });
  const toPack=el('button',{type:'button',className:'btn ghost',textContent:'Заполнить «Новый пак»'});
  toPack.addEventListener('click',()=>{
    const m=f.meta||{};
    $('npContact').value=m.avito||''; $('npTheme').value=formTitle(f);
    $('newPack').scrollIntoView({behavior:'smooth'});
  });
  const guestLink=new URL(`anketa.html?z=${selectedForm}&g=1`,location.href).href;
  const copyGuest=el('button',{type:'button',className:'btn ghost',textContent:'Ссылка для гостей'});
  copyGuest.addEventListener('click',async()=>{ await navigator.clipboard.writeText(guestLink); copyGuest.textContent='Скопирована'; });
  const del=el('button',{type:'button',className:'btn ghost',textContent:'Удалить анкету'});
  del.addEventListener('click',async()=>{
    if(!confirm('Удалить анкету со всеми ответами? Вернуть её будет нельзя.')) return;
    try{ await remove(ref(db,`forms/${selectedForm}`)); selectedForm=null; renderFormDetail(); }
    catch(e){ alert('Не удалось удалить: '+e.message); }
  });
  box.replaceChildren(el('h2',{textContent:formTitle(f)}),pre,el('div',{className:'actions'},copy,toPack,copyGuest,del));
}

$('check').addEventListener('click',validateDraft);
$('save').addEventListener('click',guarded(saveDraft));
$('publish').addEventListener('click',guarded(publish));
$('logout').addEventListener('click',()=>signOut(auth));
$('loginCard').addEventListener('submit',async e=>{
  e.preventDefault(); $('loginErr').textContent='';
  try{ await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value); }
  catch(err){ $('loginErr').textContent='Не удалось войти. Проверьте email и пароль.'; }
});
window.addEventListener('beforeunload',e=>{ if(dirty) e.preventDefault(); });

onAuthStateChanged(auth,user=>{
  if(stopOrders){ stopOrders(); stopOrders=null; }
  if(stopForms){ stopForms(); stopForms=null; }
  // в этом браузере мог остаться анонимный вход из игры: он панель не открывает
  const signedIn = !!user && !user.isAnonymous;
  $('loginCard').hidden=signedIn; $('panel').hidden=!signedIn;
  if(!signedIn){ orders={}; selectedId=null; draft=null; dirty=false; forms={}; selectedForm=null; return; }
  stopForms=onValue(ref(db,'forms'),snap=>{
    $('formsErr').textContent='';
    forms=snap.val()||{};
    renderForms();
    if(selectedForm) renderFormDetail();
  },()=>{ $('formsErr').textContent='Нет доступа к анкетам. Опубликуйте новые правила базы.'; });
  stopOrders=onValue(ref(db,'orders'),snap=>{
    $('listErr').textContent='';
    orders=snap.val()||{};
    renderOrders();
    if(selectedId){ renderDetail(); syncEditor(); }
  },()=>{ $('listErr').textContent='Нет доступа к заказам. Проверьте uid владельца в правилах базы.'; });
});
</script>
</body>
</html>
